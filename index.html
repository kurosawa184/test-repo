<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>やさしいプロンプトジェネレーター</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>やさしいプロンプトジェネレーター</h1>
      <p id="progressText" class="progress">質問 1/8</p>
    </header>

    <main class="app-main" aria-live="polite">
      <section id="howToCard" class="card howto hidden" role="dialog" aria-modal="true" aria-label="30秒でわかる使い方">
        <h2>30秒でわかる使い方</h2>
        <ol>
          <li>下の入力欄に答えを入れて「送信」を押します。</li>
          <li>途中で「＋自由質問」を押すと、気になる点をメモできます。</li>
          <li>最後に自動生成された文章を「コピー」して使います。</li>
        </ol>
        <button id="closeHowToBtn" class="primary">わかった</button>
      </section>

      <section class="card storage-card">
        <h2>保存設定</h2>
        <label class="toggle-row" for="autosaveToggle">
          <span>自動保存（localStorage【ブラウザ内に保存】）</span>
          <input id="autosaveToggle" type="checkbox" />
        </label>
        <p id="storageHint" class="hint"></p>
      </section>

      <section id="chatSection" class="card chat-section">
        <div id="chatLog" class="chat-log"></div>
      </section>

      <section id="resultSection" class="card result-section hidden">
        <h2>生成プロンプト（Plain Text）</h2>
        <textarea id="resultText" rows="16" readonly></textarea>
        <div class="result-actions">
          <button id="copyPromptBtn" class="primary">コピー</button>
          <button id="backToEditBtn">編集に戻る</button>
          <details>
            <summary>詳細（保存削除など）</summary>
            <div class="details-content">
              <button id="resetAllBtn" class="danger">最初からやり直し</button>
              <button id="clearStorageBtn">保存データ削除</button>
            </div>
          </details>
        </div>

        <section class="free-list-wrap">
          <h3>自由質問メモ一覧</h3>
          <ul id="freeQuestionList"></ul>
          <div class="free-actions">
            <button id="copyFreeListBtn">一覧をコピー</button>
          </div>
        </section>
      </section>
    </main>

    <footer id="inputBar" class="input-bar">
      <div id="questionLabel" class="question-label">質問を読み込み中…</div>
      <textarea
        id="answerInput"
        rows="2"
        placeholder="ここに入力してください"
        aria-label="回答入力"
      ></textarea>
      <div class="action-row">
        <button id="submitBtn" class="primary">送信</button>
        <button id="addFreeBtn">＋自由質問</button>
        <button id="resetBtn" class="danger">最初からやり直し</button>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="assertive"></div>

    <script src="app.js"></script>
  </body>
</html>
